name: Release

# Push a tag like v2.0.0 to build installers for Linux, macOS and Windows and attach them to a GitHub release.
# Or run it manually (Actions > Release > Run workflow): give a tag to create it and publish the release, or leave
# it empty to just get the installers as build artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v2.0.0 (empty: build installers only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install fakeroot (deb packaging)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install WiX Toolset 3 (msi packaging)
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset --version 3.14.1 -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Build installer
        shell: bash
        run: packaging/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mat-bank-${{ runner.os }}
          path: target/dist/*

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MAT Bank ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
